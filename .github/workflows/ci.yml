name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

  jobs:
    test:
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Install Python 
          run: uv python install

        - name: Install dependencies
          run: uv sync --dev 

        - name: Run Ruff
          run: uv run ruff check . 

        - name: Run MyPy
          run: uv run mypy src tests 

        - name: Run tests
          run: uv run pytest
